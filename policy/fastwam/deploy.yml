# FastWAM Deployment Configuration
# This file is loaded by scripts/eval_policy.py and passed to Policy.__init__() as `args`.

policy_name: fastwam

# --- Model Configuration ---
# Checkpoint path (relative to policy/fastwam/ or absolute)
ckpt_path: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/FastWAM/runs/insert_hdmi_uncond_2cam224_1e-4/2026-05-15_23-17-00/checkpoints/weights/step_020000.pt

# Dataset statistics for action/proprio normalization
# Located alongside the checkpoint
dataset_stats_path: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/FastWAM/runs/insert_hdmi_uncond_2cam224_1e-4/2026-05-15_23-17-00/dataset_stats.json

# Device for model inference (use cuda:1 to avoid competing with Isaac Sim)
device: cuda:0

# Mixed precision: "no", "fp16", or "bf16"
mixed_precision: bf16

# Model variant: "fastwam", "fastwam_joint", or "fastwam_idm"
model_variant: fastwam

# --- Model Architecture (matches training config) ---
# model_id / tokenizer_model_id accept either a HuggingFace repo ID or a local path.
#   - HF repo ID (default): "Wan-AI/Wan2.2-TI2V-5B" (auto-downloads to HF cache)
#   - Local path: "ckpts/Wan-AI/Wan2.2-TI2V-5B" (relative to this file)
# Pre-download with:  python scripts/download_fastwam_models.py
model_id: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/ckpts/Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/ckpts/Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: 8
  action_group_causal_mask_mode: group_diagonal
  use_gradient_checkpointing: false

action_dit_config:
  action_dim: 8
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: false

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.0
  lambda_action: 1.0

# --- Inference Settings ---
# Number of action steps to predict per inference call
action_horizon: 128
# Number of steps to execute before re-planning
replan_steps: 8
# Number of denoising steps
num_inference_steps: 10
# Random seed for noise generation (null for random)
seed: 0
# Guidance scale for text conditioning
text_cfg_scale: 1.0
# Negative prompt for classifier-free guidance
negative_prompt: ""
# Device for random noise generation
rand_device: cpu
# Whether to use tiled VAE encoding/decoding
tiled: false
# Action type passed to task.take_action(): "qpos", "ee", or "delta_ee"
action_type: qpos

# --- Camera Configuration ---
# Camera name(s) to use from observation["observation"]
# For single camera, use "head". For dual camera, use "head+wrist"
camera_names: head+wrist
# Input image resolution per camera (matching training)
camera_width: 224
camera_height: 224
# How to concatenate multiple cameras: "horizontal" or "vertical"
concat_multi_camera: horizontal

# --- Proprio Configuration ---
# Proprio dimension expected by model
proprio_dim: 8
# Action dimension expected by model
action_dim: 8

# --- Instruction ---
# Path to instruction file (relative to instructions/)
# Set to null to use default empty instruction
instruction_file: null
instuction_file: null
# Instruction type: "seen" or "unseen"
instruction_type: seen
