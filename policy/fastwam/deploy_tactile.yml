# FastWAM Deployment Configuration — insert_hdmi_tactile_uncond_2cam224_1e-4
# Usage: bash eval_policy.sh insert_HDMI demo fastwam/deploy_tactile 0

policy_name: fastwam

# --- Checkpoint ---
ckpt_path: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/FastWAM/runs/insert_hdmi_tactile_uncond_2cam224_1e-4/2026-05-25_22-36-18/checkpoints/weights/step_020000.pt
dataset_stats_path: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/FastWAM/runs/insert_hdmi_tactile_uncond_2cam224_1e-4/2026-05-25_22-36-18/dataset_stats.json

# --- Precision ---
mixed_precision: bf16
model_variant: fastwam

# --- Wan base models ---
model_id: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/ckpts/Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: /inspire/hdd/global_user/yangyi-253108120173/inspire_shared/mount/advanced-machine-learning-and-deep-learning-applications/cyy/ckpts/Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false

# --- Video DiT (matches training) ---
video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: 8
  action_group_causal_mask_mode: group_diagonal
  use_gradient_checkpointing: false

# --- Action DiT (matches training) ---
action_dit_config:
  action_dim: 8
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: false

# --- Schedulers (matches training) ---
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0

# --- Inference ---
action_horizon: 32       # (num_frames - 1) = 32, matches training
replan_steps: 8           # matches training
num_inference_steps: 10
seed: 0
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
action_type: qpos          # absolute joint positions, matches training data

# --- Camera (4 cameras → grid_2x2, matches training) ---
camera_names: observation.head.rgb+observation.wrist.rgb+tactile.left_tactile.rgb+tactile.right_tactile.rgb
camera_width: 224
camera_height: 224
concat_multi_camera: grid_2x2

# --- Proprio ---
proprio_dim: 8             # [joint1..joint7, finger]
action_dim: 8

# --- Instruction ---
instruction_file: null
instuction_file: null
instruction_type: seen
